<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کاسِس هک</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: #090d16;
      color: #f1f5f9;
      line-height: 1.8;
    }

    /* نوار نصب برنامه — فقط در سایت نمایش داده می‌شود */
    .web-install-bar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 1000;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #111c33;
      border-bottom: 1px solid #233863;
    }

    .web-install-bar.show-on-web {
      display: flex;
    }

    .web-install-title {
      font-size: 13px;
      font-weight: bold;
      color: #e2e8f0;
    }

    .install-btn {
      padding: 8px 15px;
      border-radius: 8px;
      background: #16a34a;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .brand-header {
      background: linear-gradient(135deg, #132242, #1a2436);
      border: 1px solid #293852;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      text-align: center;
    }

    .brand-header h1 {
      margin: 0 0 6px 0;
      font-size: 23px;
      color: #38bdf8;
    }

    .brand-header p {
      margin: 0;
      font-size: 13px;
      color: #94a3b8;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #283548;
      background: #111827;
      color: #f8fafc;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #243247;
      background: #111827;
      color: #f8fafc;
      font-size: 14px;
      font-weight: bold;
      text-align: right;
      cursor: pointer;
      text-decoration: none;
      transition: 0.18s ease;
    }

    .menu-btn:hover {
      background: #182234;
      border-color: #38bdf8;
    }

    .menu-btn.telegram-btn {
      background: #0c2742;
      border-color: #0284c7;
      color: #7dd3fc;
    }

    .menu-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
      white-space: nowrap;
    }

    .content-panel {
      margin-top: 16px;
      background: #0f172a;
      border: 1px solid #26354d;
      border-radius: 14px;
      padding: 16px;
      display: none;
    }

    .content-panel.active {
      display: block;
    }

    .panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .panel-title {
      margin: 0;
      font-size: 16px;
      color: #38bdf8;
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .copy-btn {
      background: #0284c7;
      color: #ffffff;
    }
