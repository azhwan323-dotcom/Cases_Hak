<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کاسِس هک</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    /* فقط زمانی که با جاوااسکریپت کلاس show-on-web اضافه شود نمایش داده می‌شود */
    .web-install-bar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 999;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .web-install-bar.show-on-web {
      display: flex;
    }
    .install-btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      background: #22c55e;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }
  </style>
</head>
<body>

  <!-- این نوار به‌طور پیش‌فرض مخفی است و فقط در سایت ظاهر می‌شود -->
  <div id="webInstallBar" class="web-install-bar">
    <span>نسخه اندروید کاسِس هک</span>
    <a id="installAppBtn" class="install-btn" href="https://github.com/azhwan323-dotcom/Cases_Hak/releases" target="_blank" rel="noopener noreferrer">
      نصب برنامه
    </a>
  </div>

  <div class="container" id="appContent">
    <!-- محتوای اصلی کاسِس هک -->
  </div>

  <script>
    const isCapacitorApp =
      window.location.protocol === "capacitor:" ||
      (window.Capacitor &&
        typeof window.Capacitor.isNativePlatform === "function" &&
        window.Capacitor.isNativePlatform());

    // فقط اگر در محیط وب/سایت باشد (داخل اپ نباشد) دکمه نصب برنامه را نشان بده
    if (!isCapacitorApp) {
      document.getElementById("webInstallBar").classList.add("show-on-web");
    }
  </script>
</body>
</html>
