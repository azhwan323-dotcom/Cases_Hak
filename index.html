<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کاسِس هک</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
    }

    /* فقط زمانی که در سایت (مرورگر) باز شود نمایش داده می‌شود */
    .web-install-bar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 999;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }

    .web-install-bar.show-on-web {
      display: flex;
    }

    .install-text {
      font-size: 13px;
      font-weight: bold;
      color: #e2e8f0;
    }

    .install-btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      background: #22c55e;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
  </style>
</head>
<body>

  <!-- نوار نصب برنامه (فقط در سایت ظاهر می‌شود) -->
  <div id="webInstallBar" class="web-install-bar">
    <span class="install-text">کاسِس هک — نسخه اندروید</span>
    <a
      id="installAppBtn"
      class="install-btn"
      href="https://github.com/azhwan323-dotcom/Cases_Hak/releases"
      target="_blank"
      rel="noopener noreferrer"
    >
      نصب برنامه
    </a>
  </div>

  <div class="container" id="appContent">
    <h1>کاسِس هک</h1>
    <p>محتوای اصلی کاسِس هک اینجا قرار می‌گیرد.</p>
  </div>

  <script>
    const isCapacitorApp =
      window.location.protocol === "capacitor:" ||
      (window.Capacitor &&
        typeof window.Capacitor.isNativePlatform === "function" &&
        window.Capacitor.isNativePlatform());

    if (!isCapacitorApp) {
      const bar = document.getElementById("webInstallBar");
      if (bar) {
        bar.classList.add("show-on-web");
      }
    }
  </script>
</body>
</html>
