name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "کاسس هک" "com.caseshak.app" --web-dir www
          npx cap add android
          if [ -f "icon.png" ]; then
            rm -f android/app/src/main/res/mipmap-anydpi*/ic_launcher*.xml
            for dir in android/app/src/main/res/mipmap-*; do
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
              cp icon.png "$dir/ic_launcher_foreground.png"
            done
          fi
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
          }
          EOF
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Cases-Hak-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
